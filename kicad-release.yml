project_name: solar-battery
output: production-files

# {{.Version}} will be replaced with the git tag. 

# List of PCBs that will be processed. This will:
# - Validate the Schematic ERC
# - Validate the PCB DRC
# - Make release files (gerber, BOM, placement file)
pcbs:
- id: solar-BQ25798
  text_variables:
    - key: TAG
      val: {{.Version}}
    - key: HASH
      val: {{.GIT_HASH}}

panels:
- id: solar-battery-panel
  path: .generated-pcbs/solar-battery-panel
  script: ./panel-solar-battery.py
  text_variables:
    - key: TAG
      val: {{.Version}}
    - key: HASH
      val: {{.GIT_HASH}}
  boms_to_join:
  - id: "solar-BQ25798"
    refRenamer: "{orig}-{n}"  # Update this from the script
    count: 3
